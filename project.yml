name: ClipPanel
options:
  bundleIdPrefix: com.clippanel
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 1.9.4
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CODE_SIGN_STYLE: Automatic
targets:
  ClipPanel:
    type: application
    platform: macOS
    sources:
      - path: ClipPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clippanel.app
        INFOPLIST_FILE: ClipPanel/Support/Info.plist
        PRODUCT_NAME: ClipPanel
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: KeyboardShortcuts
  ClipPanelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipPanelTests
    dependencies:
      - target: ClipPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clippanel.app.tests
        GENERATE_INFOPLIST_FILE: YES
  ClipPanelUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ClipPanelUITests
    dependencies:
      - target: ClipPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clippanel.app.uitests
        GENERATE_INFOPLIST_FILE: YES
  ClipPanelCLI:
    type: tool
    platform: macOS
    sources:
      - path: ClipPanelCLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clippanel.cli
        PRODUCT_NAME: clipctl
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClipPanel:
    build:
      targets:
        ClipPanel: all
        ClipPanelCLI: all
        ClipPanelTests: [test]
    test:
      targets:
        - ClipPanelTests
