name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and launch verification
    runs-on: macos-26
    # A cold Xcode build of the app plus the unit-test suite runs well past
    # 15 minutes on a hosted macOS runner; the cache below makes warm runs
    # much faster, but the timeout must still cover a cache miss.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Show Xcode and Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      # Restore DerivedData (compiled objects and the KeyboardShortcuts SPM
      # checkout) so warm runs skip the cold compile that would otherwise eat
      # the timeout. Keyed on the package lock and the XcodeGen inputs so a
      # dependency or project change never reuses stale objects.
      - name: Cache Xcode build
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ runner.os }}-${{ hashFiles('ClipPanel.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'project.yml') }}
          restore-keys: |
            xcode-${{ runner.os }}-

      - name: Build and run unit tests
        # The documented command from README.md. The default scheme runs
        # ClipPanelTests only; the UI-test target is intentionally excluded
        # (menu-bar/permission flows are covered by MANUAL_TEST_MATRIX.md).
        run: >-
          xcodebuild
          -project ClipPanel.xcodeproj
          -scheme ClipPanel
          -configuration Debug
          -derivedDataPath .build/XcodeDerivedData
          test
          CODE_SIGNING_ALLOWED=NO

      - name: Verify app bundle launches
        # Real-app smoke check: builds the .app and asserts it stays running.
        # Clipboard monitoring is off until onboarding enables it, so no
        # permission prompt can block the launch on a hosted runner.
        run: ./script/build_and_run.sh --verify
